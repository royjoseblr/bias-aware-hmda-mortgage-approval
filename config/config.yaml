project:
  random_state: 42
  target: outcome
  raw_file: data/raw/state_MI.csv
  processed_file: data/processed/hmda_modeling.csv
  test_size: 0.20
  validation_size: 0.20
filters:
  action_taken_values: [1, 3]
modeling:
  numeric_features:
    - loan_amount
    - income
    - property_value
    - tract_population
    - tract_minority_population_percent
    - ffiec_msa_md_median_family_income
    - tract_to_msa_income_percentage
  categorical_features:
    - loan_type
    - loan_purpose
    - lien_status
    - occupancy_type
    - construction_method
    - debt_to_income_ratio
    - applicant_age
  audit_features:
    - derived_race
    - derived_ethnicity
    - derived_sex
  exclude_leakage:
    - denial_reason-1
    - denial_reason-2
    - denial_reason-3
    - denial_reason-4
    - purchaser_type
    - rate_spread
    - total_loan_costs
    - total_points_and_fees
    - origination_charges
fairness:
  favorable_label: 1
  reference_groups:
    derived_race: White
    derived_ethnicity: Not Hispanic or Latino
    derived_sex: Male
